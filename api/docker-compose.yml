services:
  mysql:
    image: mysql:8.0
    container_name: alliraa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: alliraa
      MYSQL_USER: alliraa
      MYSQL_PASSWORD: alliraa
    ports:
      - "3308:3306"
    volumes:
      - alliraa_mysql_data:/var/lib/mysql
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  alliraa_mysql_data:
